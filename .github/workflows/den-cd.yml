# Generated by DeepAgent for project "den" (env "dev"). Regenerated on every deploy — edits here are overwritten; delete this line to keep the file as your own.
name: Deploy to Kubernetes (CD) · den

# Runs ONLY after the CI workflow ("Build and push to ECR · den") completes
# successfully, so the image is already in the registry before we deploy.
on:
  workflow_run:
    workflows: ["Build and push to ECR · den"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: den-dev
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access (keyless)
        run: aws eks update-kubeconfig --name "teams-dev" --region us-east-1

      - name: Ensure namespace den is Active (auto-heal if stuck Terminating)
        # Three-stage self-heal — a namespace stuck Terminating rejects every
        # kubectl apply with "unable to create new content in namespace X because
        # it is being terminated". Stuck namespaces are usually a hanging
        # LoadBalancer/PVC finalizer whose cloud resource couldn't be released
        # (LB deleted out-of-band, IAM revoked mid-clean, controller crash).
        #
        # Stage 1: wait 60s for a natural deletion to finish.
        # Stage 2: if still Terminating, force-clear finalizers on all Services +
        #          PVCs in the namespace (safe — the underlying LB is typically
        #          already gone by this point), wait another 30s.
        # Stage 3: if STILL Terminating, remove the namespace's own finalizer via
        #          the /finalize subresource (kubernetes' standard force-delete
        #          for stuck namespaces).
        # Finally: create the namespace if it's now gone (or was never there).
        #
        # Closes the 2026-08 incident where every deploy failed against a
        # Terminating namespace and required an operator to hand-clear finalizers.
        run: |
          set -eu
          NS="den"
          ns_phase() { kubectl get namespace "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || echo ""; }
          # Stage 1 — natural wait
          for i in $(seq 1 30); do
            p=$(ns_phase)
            { [ -z "$p" ] || [ "$p" = "Active" ]; } && break
            echo "namespace $NS is $p — waiting for natural termination ($i/30)"
            sleep 2
          done
          # Stage 2 — force-clear finalizers on Services + PVCs
          p=$(ns_phase)
          if [ "$p" = "Terminating" ]; then
            echo "::warning::Namespace $NS still Terminating after 60s — auto-clearing finalizers on Services and PVCs."
            for kind in svc pvc; do
              for res in $(kubectl get "$kind" -n "$NS" -o name 2>/dev/null); do
                echo "  clearing finalizers on $res"
                kubectl patch "$res" -n "$NS" -p '{"metadata":{"finalizers":null}}' --type=merge >/dev/null 2>&1 || true
              done
            done
            for i in $(seq 1 15); do
              p=$(ns_phase)
              { [ -z "$p" ] || [ "$p" = "Active" ]; } && break
              sleep 2
            done
          fi
          # Stage 3 — nuke the namespace's own finalizer via /finalize
          p=$(ns_phase)
          if [ "$p" = "Terminating" ]; then
            echo "::warning::Namespace $NS still Terminating — force-clearing its own finalizer via /finalize subresource."
            if command -v jq >/dev/null 2>&1; then
              kubectl get namespace "$NS" -o json | jq '.spec.finalizers = []' | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - >/dev/null 2>&1 || true
            else
              printf '%s' '{"apiVersion":"v1","kind":"Namespace","metadata":{"name":"'"$NS"'"},"spec":{"finalizers":[]}}' | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - >/dev/null 2>&1 || true
            fi
            sleep 3
          fi
          # Recreate if now gone
          p=$(ns_phase)
          [ -z "$p" ] && kubectl create namespace "$NS"
          p=$(ns_phase)
          if [ "$p" != "Active" ]; then
            echo "::error::Namespace $NS auto-heal exhausted; still $p. Ask the agent to run unstick_terminating_namespace for deep diagnosis."
            exit 1
          fi
          echo "namespace $NS is Active — proceeding with apply."

      - name: Pin the image to this build's immutable digest-equivalent tag
        # The committed manifest carries ":latest" so it is readable and so a
        # manual kubectl apply still works. But ":latest" is not a deploy
        # REFERENCE: it names different bytes over time, so a rollback lands
        # on whatever ":latest" points at now rather than the image that was
        # known good, and two nodes can run different code under one tag.
        # CI pushed this exact commit as :<sha> alongside :latest, so rewrite
        # the tag in the manifest before it is applied — the cluster then
        # records an immutable reference for this revision.
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -eu
          if [ -f "k8s/den/dev/manifest.yaml" ]; then
            files="k8s/den/dev/manifest.yaml"
          else
            files=$(ls "k8s/den/dev"/*.yaml "k8s/den/dev"/*.yml 2>/dev/null || true)
          fi
          for f in $files; do
            sed -i.bak "s|:latest$|:$SHA|" "$f"
            rm -f "$f.bak"
          done
          grep -h 'image:' $files || true

      - name: Apply manifests
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource. Fall back to the dir for repos whose manifests
        # are still split across multiple files.
        run: |
          if [ -f "k8s/den/dev/manifest.yaml" ]; then
            kubectl apply -n den --dry-run=server -f "k8s/den/dev/manifest.yaml"
            kubectl apply -n den -f "k8s/den/dev/manifest.yaml"
          else
            kubectl apply -n den --dry-run=server -f "k8s/den/dev/"
            kubectl apply -n den -f "k8s/den/dev/"
          fi

      - name: Restart rollout if the apply changed nothing
        # With the immutable :<sha> tag above, a new commit changes the pod
        # template and the apply alone triggers the rollout — no restart
        # needed, and the revision history records which image it was. The
        # restart stays only for a re-run of the SAME commit (a retry after a
        # transient failure), where the spec is byte-identical and Kubernetes
        # would otherwise do nothing at all.
        run: |
          if kubectl rollout status deployment/team-wallet -n den --timeout=10s >/dev/null 2>&1; then
            kubectl rollout restart deployment/team-wallet -n den
          fi

      - name: Wait for rollout
        # Timeout = the manifest's startupProbe budget + 60s for scheduling and
        # the image pull. A flat 180s silently cut a "heavy" app's 150s budget
        # short: the pod was still legitimately starting when the rollout was
        # declared failed and rolled back.
        run: kubectl rollout status deployment/team-wallet -n den --timeout=210s

      - name: Rollback on failed rollout
        # Skip `rollout undo` on the first-ever deploy (contract §5): the
        # history has one revision and there is nothing to roll back to. This
        # copy had no guard at all — a first deploy whose probes failed ended
        # in "error: no rollout history found", which read as a second, new
        # failure on top of the real one (2026-09-11, new-devops-next.js).
        # `grep -c` prints 0 and exits 1 on no match: `|| true`, never
        # `|| echo 0` (that prints a second 0 and breaks the integer test).
        if: failure()
        run: |
          REVS=$(kubectl rollout history deployment/team-wallet -n den 2>/dev/null | tail -n +3 | grep -c '^' || true)
          if [ "$REVS" -lt 2 ]; then
            echo "::warning::Rollout of team-wallet failed and this is the first-ever deploy (rollout history has $REVS revision). Nothing to roll back to — leaving the failed pods in place so you can debug them."
            exit 1
          fi
          echo "::warning::Rollout of team-wallet failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/team-wallet -n den
          kubectl rollout status deployment/team-wallet -n den --timeout=120s
