name: CI/CD Pipeline

on:
  #workflow_dispatch:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

jobs:
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

#      - name: Run TypeScript type check
#        run: npm run type-check

#      - name: Run linting
#        run: npm run lint

      - name: Run formatting check
        run: npm run format

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
