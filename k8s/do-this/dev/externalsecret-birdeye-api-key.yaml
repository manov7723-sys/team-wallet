apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: team-wallet-birdeye-api-key
  namespace: do-this
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: deepagent-aws
    kind: ClusterSecretStore
  target:
    name: app-env
    creationPolicy: Merge
  data:
    - secretKey: BIRDEYE_API_KEY
      remoteRef:
        key: this-dev-8-dev/do-this/BIRDEYE_API_KEY
