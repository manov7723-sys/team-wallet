apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: team-wallet-jupiter-api-key
  namespace: this-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: deepagent-aws
    kind: ClusterSecretStore
  target:
    name: app-env
    creationPolicy: Merge
  data:
    - secretKey: JUPITER_API_KEY
      remoteRef:
        key: this-dev-8-dev/this-dev/JUPITER_API_KEY
